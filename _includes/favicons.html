{%- comment -%}
커스텀 파비콘 설정
- 실제 아이콘 파일은 `assets/img/favicons/` 에 있습니다.
- `_plugins/copy-favicon.rb` 가 빌드 후 `favicon.ico` 를 사이트 루트(`/_site/favicon.ico`)로 복사합니다.
{%- endcomment -%}

{%- assign favicon_path = '/assets/img/favicons' -%}

<link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">

<link rel="icon" type="image/png" sizes="16x16" href="{{ favicon_path | append: '/favicon-16x16.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ favicon_path | append: '/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="96x96" href="{{ favicon_path | append: '/favicon-96x96.png' | relative_url }}">

<link rel="apple-touch-icon" sizes="57x57" href="{{ favicon_path | append: '/apple-icon-57x57.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="60x60" href="{{ favicon_path | append: '/apple-icon-60x60.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="72x72" href="{{ favicon_path | append: '/apple-icon-72x72.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="76x76" href="{{ favicon_path | append: '/apple-icon-76x76.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="114x114" href="{{ favicon_path | append: '/apple-icon-114x114.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="120x120" href="{{ favicon_path | append: '/apple-icon-120x120.png' | relative_url }}">
